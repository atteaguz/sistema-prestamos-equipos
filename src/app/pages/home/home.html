<div class="app-container">
  <!-- Barra de navegacion -->
  <mat-toolbar class="topbar">
    <div class="logo-section">
      <mat-icon class="logo-icon">construction</mat-icon>
      <span class="logo-text">CONSTRU<span class="logo-highlight">PRESTAMOS</span></span>
    </div>
    
    <span class="spacer"></span>
    
    <!-- Menu horizontal -->
    @if (authService.isLoggedIn()) {
      <div class="nav-links">
        @for (item of menuItems; track item.label) {
          <a mat-button [routerLink]="item.route" routerLinkActive="active-link" class="nav-link">
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        }
      </div>
    }
    
    <span class="spacer"></span>
    
    <!-- Acciones -->
    <div class="user-section">
      @if (authService.isLoggedIn()) {
        <button mat-icon-button [matMenuTriggerFor]="userMenu">
          <mat-icon>account_circle</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item disabled>
            <mat-icon>badge</mat-icon>
            <span>Rol: {{ authService.getRol() }}</span>
          </button>
          <button mat-menu-item (click)="logout()">
            <mat-icon>exit_to_app</mat-icon>
            <span>Cerrar Sesión</span>
          </button>
        </mat-menu>
      }
    </div>
  </mat-toolbar>
  
  <!-- Contenido -->
  <div class="main-content">
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </div>
  
  <!-- Footer -->
  <app-footer></app-footer>
  
</div>

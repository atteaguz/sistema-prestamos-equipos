<div class="table-container">
  <div class="table-header">
    <button mat-raised-button color="primary" (click)="crearModificarCategoria(null, false)">
      <mat-icon>add</mat-icon>
      Crear Categoría
    </button>

    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Filtrar</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ej: Maquinaria pesada" #input>
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort>

    <!-- Columna ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let row"> {{row.id}} </td>
    </ng-container>

    <!-- Columna Categoria -->
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Categoria </th>
      <td mat-cell *matCellDef="let row"> {{row.nombre}} </td>
    </ng-container>

    <!-- Columna Descripcion -->
    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Descripcion </th>
      <td mat-cell *matCellDef="let row"> {{row.descripcion}} </td>
    </ng-container>

    <!-- Columna Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button class="btn-edit" (click)="crearModificarCategoria(row, true)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button class="btn-delete" (click)="eliminarCategoria(row)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
          <button mat-icon-button class="btn-view" (click)="crearModificarCategoria(row, false)" matTooltip="Detalles">
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Linea de datos vacíos -->
    <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          No hay datos que coincidan con el filtro "{{input.value}}"
        </td>
      </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25, 50]" showFirstLastButtons aria-label="Seleccionar página de usuarios"></mat-paginator>
</div>
